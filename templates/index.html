<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Student names</title>
  </head>
  <body>
    <h1>Students</h1>
    {% if names %}
    <ul>
      {% for name in names %}
      <li>{{ name }}</li>
      {% endfor %}
    </ul>
    {% else %}
    <p>No students found.</p>
    {% endif %}
  </body>
</html>
